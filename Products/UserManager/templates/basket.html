<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваш кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<div>
    <h2 class="text-center mb-4">Ваш кошик</h2>

    {% if items %}
    <table class="table table-bordered text-center">
        <thead class="table-light">
            <tr>
                <th>Товар</th>
                <th>Кількість</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.product.name }}</td>
                <td>{{ item.count }}</td>
                <td>
                    <a href="{% url 'delete_basket' item.product.id %}" class="btn btn-sm btn-danger">Видалити</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-center">Кошик порожній</p>
    {% endif %}

    <p class="text-center mt-3">
        <a href="{% url 'product_list' %}" class="btn btn-primary">Повернутися до продуктів</a>
    </p>
    <p>
    <li class="nav-item">
        <a class="nav-link active" href="{% url 'index' %}">Повернутися до головної сторінки</a>
    </li>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
