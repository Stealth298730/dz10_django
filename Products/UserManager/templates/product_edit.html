{% extends "base.html" %}

{% block content %}
<h2>Редагувати продукт: {{ product.name }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Зберегти зміни" class="btn btn-primary">
</form>

<a href="{% url 'product_list' %}" class="btn btn-secondary mt-3">Назад до списку</a>
{% endblock content %}
